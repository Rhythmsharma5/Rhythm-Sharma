<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS | Command Console</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">J</span>
          <div>
            <p class="eyebrow">SYSTEM</p>
            <h1>JARVIS</h1>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active">Overview</button>
          <button class="nav-item">Operations</button>
          <button class="nav-item">Reports</button>
          <button class="nav-item">Security</button>
        </nav>

        <div class="status-panel">
          <p class="panel-label">Core Systems</p>
          <ul>
            <li><span class="dot green"></span> Power Grid</li>
            <li><span class="dot green"></span> Neural Link</li>
            <li><span class="dot yellow"></span> Resource Scan</li>
            <li><span class="dot blue"></span> Communication</li>
          </ul>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">MISSION CONTROL</p>
            <h2>Assistant Interface</h2>
          </div>
          <button id="voiceToggle" class="voice-btn">Activate Voice</button>
        </header>

        <section class="hero">
          <div class="hero-copy">
            <p class="tag">Good evening, Sir.</p>
            <h3 id="greeting">System online and ready.</h3>
          </div>
          <div class="metrics">
            <div class="metric-box">
              <span>CPU</span>
              <strong id="cpuLoad">68%</strong>
            </div>
            <div class="metric-box">
              <span>Memory</span>
              <strong id="memoryLoad">74%</strong>
            </div>
            <div class="metric-box">
              <span>Uptime</span>
              <strong id="uptime">06:42:18</strong>
            </div>
          </div>
        </section>

        <section class="console">
          <div class="console-header">
            <span>Command Console</span>
            <span id="statusText">Listening</span>
          </div>

          <div id="chatLog" class="chat-log" aria-live="polite">
            <div class="message assistant">
              <span class="label">JARVIS</span>
              <p>Welcome back. Awaiting command.</p>
            </div>
          </div>

          <div class="input-row">
            <input
              id="commandInput"
              type="text"
              placeholder="Type a command..."
              autocomplete="off"
            />
            <button id="sendBtn">Execute</button>
          </div>

          <div class="quick-actions">
            <button class="quick-btn" data-command="status">Status</button>
            <button class="quick-btn" data-command="time">Time</button>
            <button class="quick-btn" data-command="weather">Weather</button>
            <button class="quick-btn" data-command="tasks">Tasks</button>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
